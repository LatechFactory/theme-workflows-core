name: list-themes (reusable)

# Workflow REUSABLE (workflow_call). FASE 1: lista los themes del store (id, título, rol)
# con el Theme Access token y escribe `themes-live.json` en main (commit solo si cambió),
# para que eve lo lea por la API de GitHub. NO baja código — solo el listado.
# Es read-mostly: la mayoría de las corridas no cambian nada (no commitean).

on:
  workflow_call:
    inputs:
      shop_domain:
        required: true
        type: string

permissions:
  contents: write

env:
  SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_THEME_TOKEN }}
  SHOPIFY_FLAG_STORE: ${{ inputs.shop_domain }}

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm i -g @shopify/cli@4.9.5

      - name: Listar themes (id, nombre, rol, fechas si existen)
        run: |
          # El formato de `theme list --json` varía según la versión del CLI y la config
          # del repo: a veces es un array plano de themes, a veces viene envuelto
          # (p. ej. {environments:[{result:...}]}). En lugar de asumir la forma, juntamos
          # recursivamente todos los objetos de theme (los que tienen id y role) — robusto
          # ante cambios de wrapper. Orden estable por id (minimiza diffs); eve reordena
          # para mostrar. updated_at/created_at quedan en null si el CLI no los provee
          # (eve cae a id). Acepta camelCase por si una versión nueva los renombra.
          shopify theme list --json > raw-themes.json
          echo "=== raw theme list ==="; cat raw-themes.json; echo "======================"
          jq '[ .. | objects | select(has("id") and has("role")) ]
                | sort_by(.id)
                | [ .[] | {
                    id,
                    name,
                    role,
                    updated_at: (.updated_at // .updatedAt // null),
                    created_at: (.created_at // .createdAt // null)
                  } ]' raw-themes.json > themes-live.json
          echo "themes-live.json:"; cat themes-live.json

      - name: Commit si cambió
        run: |
          git config user.name "theme-merge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes-live.json
          if git diff --cached --quiet; then
            echo "Sin cambios en themes-live.json"
          else
            git commit -m "themes-live: actualizar listado"
            git pull --rebase origin main
            git push origin main
          fi
