name: merge-apply (reusable)

# Workflow REUSABLE (workflow_call). Etapa 4b: ejecuta el merge de verdad (politica B).
#   - Merge limpio  -> push scopeado al theme destino (sin publicar) + anotacion JSON.
#   - Conflicto git -> pushea branches y entrega link de compare (la org bloquea
#                      crear PRs con el GITHUB_TOKEN). Nunca publica, nunca toca el live.
# Cada store repo la invoca con un thin caller (workflow_dispatch). El link de compare
# usa github.server_url/github.repository, que en una reusable apuntan al repo CALLER.

on:
  workflow_call:
    inputs:
      origen:
        description: "Theme ID origen (X)"
        required: true
        type: string
      destino:
        description: "Theme ID destino (A)"
        required: true
        type: string
      shop_domain:
        required: true
        type: string

permissions:
  contents: write

# Sin `concurrency` aca: la serializacion (grupo "registry") la pone el thin caller
# del store. Ponerla en ambos lados genera un deadlock de concurrency al anidar.

env:
  SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_THEME_TOKEN }}
  SHOPIFY_FLAG_STORE: ${{ inputs.shop_domain }}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm i -g @shopify/cli

      - name: Configurar git
        run: |
          git config user.name "theme-merge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preparar origen y destino (adoptar si falta)
        # El panel de merges puede pasar themes que existen en el store pero no tienen branch.
        # Como el merge pullea el contenido igual, acá solo garantizamos que cada theme tenga
        # su branch (si no está adoptado: branch desde el live + registro). El destino nunca
        # puede ser el live.
        run: |
          X="${{ inputs.origen }}"; A="${{ inputs.destino }}"
          if [ -z "$X" ] || [ -z "$A" ]; then echo "Falta origen y/o destino"; exit 1; fi
          if [ "$X" = "$A" ]; then echo "Origen y destino son el mismo theme"; exit 1; fi
          case "$X" in ''|*[!0-9]*) echo "Origen invalido: '$X'"; exit 1 ;; esac
          case "$A" in ''|*[!0-9]*) echo "Destino invalido: '$A'"; exit 1 ;; esac

          LIST=$(shopify theme list --json)
          ROW_X=$(echo "$LIST" | jq -c --argjson id "$X" '.[] | select(.id == $id)')
          ROW_A=$(echo "$LIST" | jq -c --argjson id "$A" '.[] | select(.id == $id)')
          [ -z "$ROW_X" ] && { echo "El origen $X no existe en la tienda."; exit 1; }
          [ -z "$ROW_A" ] && { echo "El destino $A no existe en la tienda."; exit 1; }

          ROLE_A=$(echo "$ROW_A" | jq -r '.role')
          if [ "$ROLE_A" = "live" ]; then echo "ABORTADO: el destino $A es el live."; exit 1; fi
          NAME_X=$(echo "$ROW_X" | jq -r '.name')
          NAME_A=$(echo "$ROW_A" | jq -r '.name')

          git fetch origin
          git show origin/main:themes.json > /tmp/reg.json 2>/dev/null || echo '{}' > /tmp/reg.json
          MIRRORED=0

          ensure_branch() {
            ID="$1"; NAME="$2"; VAR="$3"
            B=$(jq -r --arg id "$ID" '.[$id].branch // empty' /tmp/reg.json)
            if [ -n "$B" ]; then echo "$VAR=$B" >> "$GITHUB_ENV"; echo "$ID -> $B (ya adoptado)"; return 0; fi
            # No adoptado: refrescar el live a main (una sola vez) y crear la branch desde el live.
            if [ "$MIRRORED" = "0" ]; then
              git checkout main && git pull --rebase origin main
              shopify theme pull --live --force --path .
              git add -A
              if ! git diff --cached --quiet; then
                git commit -m "mirror: previo a merge"
                git pull --rebase origin main && git push origin main
              fi
              MIRRORED=1
            fi
            SLUG=$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\+/-/g; s/^-//; s/-$//')
            [ -z "$SLUG" ] && SLUG="theme-$ID"
            B="theme/$SLUG"
            if git ls-remote --exit-code --heads origin "$B" >/dev/null 2>&1; then B="theme/$SLUG-$ID"; fi
            git checkout -B "$B" main && git push -u origin "$B"
            git checkout main && git pull --rebase origin main
            [ -f themes.json ] || echo '{}' > themes.json
            if [ "$(jq -r --arg id "$ID" 'has($id)' themes.json)" != "true" ]; then
              jq --arg id "$ID" --arg branch "$B" --arg title "$NAME" --arg created "$(date -u +%Y-%m-%d)" \
                '.[$id] = { branch: $branch, title: $title, ticket: "", origin: "manual", created: $created, last_push: null, status: "open" }' \
                themes.json > tmp.json && mv tmp.json themes.json
              git add themes.json && git commit -m "registro (merge): $NAME ($ID)"
              git pull --rebase origin main && git push origin main
            fi
            echo "$VAR=$B" >> "$GITHUB_ENV"; echo "$ID -> $B (adoptado ahora)"
          }

          ensure_branch "$X" "$NAME_X" "BRANCH_X"
          ensure_branch "$A" "$NAME_A" "BRANCH_A"

          echo "X=$X" >> "$GITHUB_ENV"
          echo "A=$A" >> "$GITHUB_ENV"
          echo "ROLE_A=$ROLE_A" >> "$GITHUB_ENV"

      - name: Pull del origen (X) y push de su branch
        run: |
          git fetch origin "$BRANCH_X"
          git checkout -B "$BRANCH_X" "origin/$BRANCH_X"
          shopify theme pull --theme "$X" --force --path .
          git add -A
          git commit -m "merge-apply: pull de origen $X" || echo "origen sin cambios"
          git push origin "$BRANCH_X"

      - name: Pull del destino (A) sobre su branch
        run: |
          git fetch origin "$BRANCH_A"
          git checkout -B "$BRANCH_A" "origin/$BRANCH_A"
          shopify theme pull --theme "$A" --force --path .
          git add -A
          git commit -m "merge-apply: pull de destino $A" || echo "destino sin cambios"

          # Estado del destino previo al merge: base para clasificar el diff JSON
          # y para calcular los archivos que el merge introduce.
          echo "PRE_A=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ -f config/settings_data.json ]; then
            cp config/settings_data.json /tmp/old_settings.json
          fi

      - name: Merge
        run: |
          git checkout "$BRANCH_A"
          if git merge --no-ff "$BRANCH_X" -m "merge: $BRANCH_X -> $BRANCH_A"; then
            echo "RESULT=clean" >> "$GITHUB_ENV"
          else
            echo "RESULT=conflict" >> "$GITHUB_ENV"
            git merge --abort
          fi

      # ---------- camino conflicto: handoff por link de compare, sin tocar Shopify ----------
      # No se crea el PR con el GITHUB_TOKEN (la org lo tiene bloqueado). Se pushean
      # ambas branches y se entrega el link de compare para abrir el PR con un click.
      - name: Conflicto — push y link de compare
        if: env.RESULT == 'conflict'
        run: |
          git push origin "$BRANCH_A"

          COMPARE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BRANCH_A}...${BRANCH_X}?expand=1"
          echo "COMPARE=$COMPARE" >> "$GITHUB_ENV"
          echo "Conflicto. Branches pusheadas. Abrir PR: $COMPARE"

      # ---------- camino limpio: push scopeado a Shopify ----------
      - name: Limpio — archivos del merge
        if: env.RESULT == 'clean'
        run: |
          FILES=$(git diff --name-only "$PRE_A" HEAD \
            | grep -E '^(assets|blocks|config|layout|locales|sections|snippets|templates)/' \
            || true)

          if [ -z "$FILES" ]; then
            echo "El merge no toca archivos de theme"
            echo "PUSHED=0" >> "$GITHUB_ENV"
          else
            printf '%s\n' "$FILES" > /tmp/files.txt
            echo "$FILES"
            echo "ONLY=$(echo "$FILES" | sed 's/^/--only /' | tr '\n' ' ')" >> "$GITHUB_ENV"
            echo "HAS_FILES=1" >> "$GITHUB_ENV"
          fi

      - name: Limpio — re-check de rol y push a Shopify
        if: env.RESULT == 'clean' && env.HAS_FILES == '1'
        run: |
          # El rol se re-consulta inmediatamente antes del push (DESIGN 6.1):
          # entre el guard inicial y aca alguien pudo publicar el theme.
          ROLE=$(shopify theme list --json \
            | jq -r --argjson id "$A" '.[] | select(.id == $id) | .role')
          echo "Rol destino (pre-push): $ROLE"
          if [ "$ROLE" != "unpublished" ]; then
            echo "ABORTADO: destino $A tiene rol '$ROLE' (se esperaba unpublished)"
            exit 1
          fi

          shopify theme push --theme "$A" --force --path . $ONLY
          echo "PUSHED=1" >> "$GITHUB_ENV"

      - name: Limpio — persistir branch y last_push
        if: env.RESULT == 'clean'
        run: |
          git push origin "$BRANCH_A"

          if [ "${PUSHED:-0}" = "1" ]; then
            git fetch origin main
            git checkout -B main origin/main
            jq --arg id "$A" \
               --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
               '.[$id].last_push = $ts' themes.json > tmp.json && mv tmp.json themes.json
            if ! git diff --quiet themes.json; then
              git add themes.json
              git commit -m "merge push: $A"
              git pull --rebase origin main
              git push origin main
            fi
          fi

      - name: Limpio — clasificar diff JSON (anotacion, DESIGN 5.1)
        if: env.RESULT == 'clean' && env.HAS_FILES == '1'
        run: |
          : > /tmp/destructive.txt
          : > /tmp/structural.txt

          # settings_data.json: claves del merchant modificadas o eliminadas.
          if grep -q '^config/settings_data\.json$' /tmp/files.txt \
             && [ -f /tmp/old_settings.json ] && [ -f config/settings_data.json ]; then
            git show "$BRANCH_A:config/settings_data.json" > /tmp/new_settings.json 2>/dev/null \
              || cp config/settings_data.json /tmp/new_settings.json
            jq -n \
              --slurpfile o /tmp/old_settings.json \
              --slurpfile n /tmp/new_settings.json '
              ($o[0]) as $o | ($n[0]) as $n
              | [ $o | paths(scalars) ]
              | map(select( ($o|getpath(.)) != ($n|getpath(.)) ))
              | map(map(tostring) | join("."))
              | .[]' > /tmp/destructive.txt 2>/dev/null || true
          fi

          # templates/sections JSON: cambio estructural, pista para el preview.
          grep -E '^(templates/.*\.json|sections/.*\.json)$' /tmp/files.txt \
            > /tmp/structural.txt || true

      - name: Escribir merge-result.json
        if: always()
        # Resultado parseable para que eve (el panel de merges) lo lea por la API de GitHub.
        run: |
          git config user.name "theme-merge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main && git checkout -B main origin/main

          RES="${RESULT:-error}"
          [ "${PUSHED:-0}" = "1" ] && DEP=true || DEP=false
          if [ -s /tmp/files.txt ]; then
            FILES=$(jq -R -s 'split("\n") | map(select(length > 0))' /tmp/files.txt)
          else
            FILES='[]'
          fi
          PREVIEW="https://${{ inputs.shop_domain }}/?_ab=0&_fd=0&_sc=1&preview_theme_id=${A:-}"

          jq -n \
            --arg result "$RES" \
            --argjson deployed "$DEP" \
            --arg origen "${X:-}" --arg destino "${A:-}" \
            --arg compare "${COMPARE:-}" --arg preview "$PREVIEW" \
            --argjson files "$FILES" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{ result: $result, deployed: $deployed, origen: $origen, destino: $destino, compare_url: $compare, preview: $preview, files: $files, at: $at }' \
            > merge-result.json

          git add merge-result.json
          if ! git diff --cached --quiet; then
            git commit -m "merge-result: $RES (${X:-?} -> ${A:-?})"
            git pull --rebase origin main && git push origin main
          fi

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Merge apply"
            echo ""
            echo "| | Theme | Branch |"
            echo "|---|---|---|"
            echo "| Origen (X)  | \`${X:-?}\` | \`${BRANCH_X:-?}\` |"
            echo "| Destino (A) | \`${A:-?}\` | \`${BRANCH_A:-?}\` |"
            echo ""

            case "${RESULT:-none}" in
              conflict)
                echo "**Resultado: ⚠️ conflicto de git** — escala a developer."
                if [ -n "${COMPARE:-}" ]; then
                  echo ""
                  echo "Branches pusheadas. **[Abrir PR para resolver el conflicto](${COMPARE})**"
                fi
                ;;
              clean)
                if [ "${PUSHED:-0}" = "1" ]; then
                  echo "**Resultado: ✅ merge limpio, pusheado al destino** (sin publicar)."
                  echo ""
                  echo "**[Abrir preview para verificar](https://${{ inputs.shop_domain }}/?_ab=0&_fd=0&_sc=1&preview_theme_id=${A})**"
                else
                  echo "**Resultado: ✅ merge limpio** — sin archivos de theme para pushear."
                fi
                if [ -s /tmp/files.txt ]; then
                  echo ""; echo "**Archivos pusheados:**"; echo '```'; cat /tmp/files.txt; echo '```'
                fi
                if [ -s /tmp/destructive.txt ]; then
                  echo ""
                  echo "> ⚠️ **Claves del merchant modificadas/eliminadas en \`settings_data.json\`.**"
                  echo "> Revisar estas rutas en el preview:"
                  echo '```'; head -n 30 /tmp/destructive.txt; echo '```'
                fi
                if [ -s /tmp/structural.txt ]; then
                  echo ""; echo "**JSON estructural a mirar en el preview:**"
                  echo '```'; cat /tmp/structural.txt; echo '```'
                fi
                ;;
              *)
                echo "**Resultado: el flujo no llego al merge** — ver logs del job."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
