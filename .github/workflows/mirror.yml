name: mirror-live-theme (reusable)

# Workflow REUSABLE (workflow_call). Pulea el theme live del store a `main` (el espejo).
# Cada store repo la invoca con un thin caller que dispara por `schedule` + workflow_dispatch
# y pasa shop_domain + `secrets: inherit`.

on:
  workflow_call:
    inputs:
      shop_domain:
        required: true
        type: string

permissions:
  contents: write

# Sin `concurrency` aca: la serializacion (grupo "registry") la pone el thin caller
# del store. Ponerla en ambos lados genera un deadlock de concurrency al anidar.

env:
  SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_THEME_TOKEN }}
  SHOPIFY_FLAG_STORE: ${{ inputs.shop_domain }}

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm i -g @shopify/cli

      - name: Pull del theme live
        run: shopify theme pull --live --force --path .

      - name: Commit si hay cambios
        run: |
          git config user.name "theme-merge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "mirror: $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git pull --rebase origin main
            git push origin main
          fi
